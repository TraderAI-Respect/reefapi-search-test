              return sorted(rows.values(), key=lambda x:(x['model'], x['city'], x['ad_id'])), list(pending.values())
          
          def cell(value):
              value = html.escape(str(value), quote=False).replace('\n',' ').replace('\r',' ')
              return value.replace('\\','\\\\').replace('|','\\|').replace('[','\\[').replace(']','\\]').replace('*','\\*').replace('`','\\`').replace('_','\\_')
          
          def model_key(token):
              token = re.sub(r'\s+', '', token.casefold())
              return 's19' if token.startswith('s19') else token
          
          def query_scope(query):
              text = normalize_models(query)
              tokens = list(TOKEN.finditer(text))
              found = identify(text)
              if len(tokens) != 1 or len(found) != 1 or not found[0]['valid']:
                  raise RuntimeError('Query must identify one supported model; ambiguous/unsupported query was not sent.')
              return model_key(tokens[0].group())
          
          def title_decision(title, query):
              scope = query_scope(query)
              text = normalize_models(title)
              goods = re.sub(r'на\s+запчасти', '', text, flags=re.I)
              parts_title = re.sub(r'\(\s*\d+\s+чип(?:а|ов)?\s*\)', '', text, flags=re.I)
              if BUYER.search(text) or PARTS.search(parts_title) or ACCESSORY.search(goods):
                  return 'reject', 'accessory_or_service'
              if re.search(r'\bxp\b|\bhyd(?:ro)?\b|гидро|s19\w*(?:xp|hydro)', text, re.I):
                  return 'reject', 'excluded_xp_or_hydro'
              known = {model_key(m.group()) for m in TOKEN.finditer(text)}
              shaped = {model_key(m.group()) for m in re.finditer(r'\b[a-z]{1,4}\d{1,5}[a-z0-9+]*\b', text, re.I)}
              keys = known | shaped
              if scope in keys and keys != {scope}:
                  return 'review', 'mixed_models_in_title'
              if scope not in keys:
                  return ('reject','different_model') if keys else ('review','model_not_clear_in_title')
              if not any(item['valid'] for item in identify(text)):
                  return 'review', 'variant_not_clear_in_title'
              return 'pass', 'model_matches_query'
          
          def main():
              run_id = os.environ['GITHUB_RUN_ID']
              if not re.fullmatch(r'[0-9]+',run_id):
                  raise SystemExit('Invalid run ID')
              root = Path('results/apify-test/runs')/run_id
              if not (root/'created.json').is_file():
                  raise SystemExit('New-run marker missing; existing reports are not modified')
              def load(name, fallback):
                  path = root/name
                  return json.loads(path.read_text(encoding='utf-8')) if path.exists() else fallback
              def write(name, value):
                  path = root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  with path.open('x',encoding='utf-8') as stream:
                      stream.write(value)
              request = load('request.json', {})
              query = request.get('query','')
              page = load('page.json', {'ads':[]})
              rows, pending = collect([page])
              if query:
                  rows = [row for row in rows if title_decision(row['model'],query)[0]=='pass']
              else:
                  rows = []
              model_decisions = load('model-decisions.json', [])
              for row in model_decisions:
                  if row['decision']=='review':
                      pending.append({k:row.get(k,'') for k in ('ad_id','title','city','url')} | {'reason':'Модель в заголовке неоднозначна; ' + row['reason']})
              for row in load('detail-decisions.json', []):
                  if row.get('decision')=='review':
                      pending.append({k:row.get(k,'') for k in ('ad_id','title','city','url')} | {'reason':'Модель подробной карточки неоднозначна; ' + row['reason']})
              counters = load('collection-counters.json', {'received':None,'model_pass':0,'details_requested':0,'blocked':None,'descriptions':0})
              counters['confirmed'] = len(rows)
              write('counters.json', json.dumps(counters,ensure_ascii=False,indent=2)+'\n')
              error = load('collection-error.json', None)
              message = (f"Тест: {query or 'не выполнен'}, регион {request.get('location','не указан')}. "
                         f"Получено карточек: {counters['received'] if counters['received'] is not None else 'неизвестно'}; прошло модельный фильтр: {counters['model_pass']}; "
                         f"запрошено подробностей: {counters['details_requested']}; заблокировано: {counters['blocked']}; "
                         f"полных описаний: {counters['descriptions']}; подтверждено по описаниям: {counters['confirmed']}.")
              warning = ('Блокировка или отсутствие описаний не означает отсутствия подходящих партий. '
                         'Проверены максимум 3 объявления; это не полный поиск. Фактический остаток у продавца не проверялся.')
              if error:
                  warning += ' Сбор/диагностика завершились с ошибкой: см. collection-error.json и read-errors.json в каталоге соответствующего этапа.'
              text = ['# Подходящие объявления этого запуска','',message,'',warning,'',
                      'Пороги количества сохранены: S19 (кроме XP/Hydro) от 15, M50 от 10, T21 от 20, A10/A11 от 1, B8/BT200 от 5; остальные ранее поддерживаемые модели от 20.',
                      '', '| Количество | Город | Модель | Цена | Состояние | Подтверждение | Ссылка |',
                      '|---|---|---|---|---|---|---|']
              for row in rows:
                  text.append('| '+' | '.join(cell(row[k]) for k in ['quantity','city','model','price','condition','evidence'])+f" | [Авито]({row['url']}) |")
              write('matches/README.md','\n'.join(text)+'\n')
              write('matches/ads.json',json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
              with (root/'matches/ads.csv').open('x',encoding='utf-8-sig',newline='') as stream:
                  fields=['quantity','city','model','price','condition','evidence','url','ad_id']
                  writer=csv.writer(stream); writer.writerow(fields)
                  for row in rows:
                      values=[str(row[k]) for k in fields]
                      writer.writerow(["'"+v if v.startswith(('=','+','-','@')) else v for v in values])
              review=['# Нужна ручная проверка','', 'Эти объявления не признаны подходящими.','',
                      '| Город | Объявление | Причина | Ссылка |','|---|---|---|---|']
              for row in pending:
                  review.append('| '+' | '.join(cell(row[k]) for k in ['city','title','reason'])+f" | [Авито]({row['url']}) |")
              write('review/README.md','\n'.join(review)+'\n')
              write('review/ads.json',json.dumps(pending,ensure_ascii=False,indent=2)+'\n')
              summary=['# Apify: один ограниченный тест','',message,'',warning,'',
                       '[Подходящие](matches/README.md) · [Неоднозначные](review/README.md)','',
                       'Диагностика: request.json; search/ и details/ содержат Input/Output, metadata, summary, errors, log и статусы чтения. '
                       'requested-input.json — отправленное тело запроса, Input.json — сохранённый Input сервиса; Output.json — dataset без фильтрации строк. '
                       'Отсутствующий диагностический файл отмечается в diagnostic-status.json/read-errors.json, а не подменяется пустым результатом.','',
                       'Причины решений: model-decisions.json и detail-decisions.json. Счётчики: counters.json. '
                       'Не больше двух Actor-запусков с пределом $0.10 каждый; лимиты не означают нулевой расход. '
                       'Секреты, заголовки авторизации, параметры и фрагменты URL скрываются перед сохранением. Старые результаты и прогресс не изменяются.']
              write('README.md','\n'.join(summary)+'\n')
              step_summary=os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  repo=os.environ['GITHUB_REPOSITORY']
                  with open(step_summary,'a',encoding='utf-8') as stream:
                      stream.write('\n'+message+'\n\n'+warning+'\n\n')
                      stream.write(f'[Результаты этого запуска](https://github.com/{repo}/tree/main/results/apify-test/runs/{run_id})\n')
              print(message)
          
          if __name__ == '__main__':
              main()
          PY

      - name: Save only this new Apify run directory
        if: always() && steps.prepare.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          run_dir="results/apify-test/runs/$GITHUB_RUN_ID"
          test -f "$run_dir/created.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$run_dir/"
          while IFS= read -r changed; do
            [[ "$changed" == "$run_dir/"* ]] || { echo "Refusing unrelated staged changes"; exit 1; }
          done < <(git diff --cached --name-only)
          if ! git diff --cached --quiet; then
            git commit -m "Save bounded Apify test diagnostics for run $GITHUB_RUN_ID"
            git push origin HEAD:main
          fi

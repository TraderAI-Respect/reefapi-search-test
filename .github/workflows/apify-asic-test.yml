                  errors.append({'file':'Output.json','error':'defaultDatasetId absent'})
              if run['status'] != 'SUCCEEDED':
                  errors.append({'error':'Actor terminal status '+str(run['status'])})
              if errors:
                  save(stage_folder/'read-errors.json', errors, token)

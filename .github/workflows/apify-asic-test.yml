                      by_id = {x['ad_id']:x for x in candidates(detail_rows,3)}
                      counters['blocked'] += sum(bool(x.get('blocked')) for x in detail_rows if isinstance(x,dict))
                      for item in selected:
                          matches = [r for r in detail_rows if isinstance(r,dict) and str(r.get('listing_id') or r.get('id') or '')==item['ad_id']]
                          detail = by_id.get(item['ad_id'])

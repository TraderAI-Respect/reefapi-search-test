name: Apify ASIC free test

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Одна модель из списка для малого теста'
        type: string
        required: true
        default: 'Antminer S19'
      location:
        description: 'all — Россия; moskva — Москва; либо slug города'
        type: string
        required: true
        default: 'all'

permissions:
  contents: write

concurrency:
  group: asic-full-scan
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reserve a new run-specific directory
        id: prepare
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          run_id = os.environ['GITHUB_RUN_ID']
          if not re.fullmatch(r'[0-9]+',run_id) or os.environ.get('GITHUB_RUN_ATTEMPT','1') != '1':
              raise SystemExit('Invalid run ID or rerun attempt: no Actor request is allowed.')
          folder = Path('results/apify-test/runs')/run_id
          try:
              folder.mkdir(parents=True, exist_ok=False)
          except FileExistsError:
              raise SystemExit('Run folder already exists: old files are preserved; no Actor request is allowed.')
          (folder/'created.json').write_text('{"new_run_folder":true}\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
              stream.write('created=true\n')
          PY

      - name: Test bounded Apify search and filtered details
        if: steps.prepare.outputs.created == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ASIC_QUERY: ${{ inputs.query }}
          ASIC_LOCATION: ${{ inputs.location }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Bounded cloud-only Apify test; never request Avito from GitHub."""
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          
          ROOT = Path('results/apify-test')
          ACTOR = 's-r~avito-scraper'
          BASE = 'https://api.apify.com/v2'
          MAX_RESPONSE_BYTES = 2 * 1024 * 1024
          
          BRAND_ALIASES = {
              'антмайнер':'antminer', 'антминер':'antminer', 'антмайнeр':'antminer',
              'битмайн':'bitmain', 'битмейн':'bitmain',
              'ватсмайнер':'whatsminer', 'вотсмайнер':'whatsminer', 'вацмайнер':'whatsminer',
              'микробт':'microbt', 'инносиликон':'innosilicon', 'иносиликон':'innosilicon',
              'инносилликон':'innosilicon', 'авалон':'avalon', 'канаан':'canaan',
              'битфури':'bitfury', 'битфьюри':'bitfury', 'эбит':'ebit',
              'хаммер':'hummer', 'айден':'aiden', 'аладдин':'aladdin', 'чита':'cheetah',
              'про':'pro', 'мини':'mini', 'турбо':'turbo', 'гидро':'hydro',
              'хр':'xp', 'хп':'xp',
          }
          MODEL_LETTERS = str.maketrans({'с':'s','т':'t','л':'l','м':'m','а':'a','д':'d',
              'з':'z','б':'b','в':'b','н':'h','к':'k','е':'e','и':'i','ж':'j','ф':'f','х':'x'})
          
          def normalize_models(text):
              """Normalize only brands/model-shaped tokens, preserving Russian sales text."""
              text = re.sub(r'\b([sсtтmмlлdдaаeеbв])\s+(\d{1,4})', r'\1\2', str(text), flags=re.I)
              def word(match):
                  value = match.group().lower()
                  if value in BRAND_ALIASES:
                      return BRAND_ALIASES[value]
                  for alias, brand in BRAND_ALIASES.items():
                      if brand in ('pro','mini','turbo','hydro','xp'):
                          continue
                      if value.startswith(alias) and re.match(r'[a-zа-яё]?\d', value[len(alias):]):
                          value = brand + ' ' + value[len(alias):]
                          break
                  chunks = value.split(' ')
                  result = []
                  for chunk in chunks:
                      if re.match(r'^[a-zа-яё]{1,4}\d', chunk):
                          chunk = re.sub(r'про(?=\+?$)', 'pro', chunk)
                          chunk = re.sub(r'(?:хр|хп)(?=\+?$)', 'xp', chunk)
                          chunk = re.sub(r'гидро$', 'hydro', chunk)
                          chunk = chunk.translate(MODEL_LETTERS)
                      result.append(chunk)
                  return ' '.join(result)
              text = re.sub(r'[a-zа-яё][a-zа-яё0-9+/-]*', word, str(text), flags=re.I)
              text = re.sub(r'\b(antminer|bitmain|whatsminer|microbt|innosilicon|avalon|canaan|bitfury|ebit)(?=[a-z]?\d)', r'\1 ', text, flags=re.I)
              text = re.sub(r'(?<=pro)\s+с\b', ' s', text, flags=re.I)
              text = re.sub(r'\b(s19)\s+([кkиieеj])(?=\s|$)', lambda m:m[1]+m[2].translate(MODEL_LETTERS), text, flags=re.I)
              text = re.sub(r'(?<![a-zа-я])[xх]\s*[pрп](?![a-zа-я])', 'xp', text, flags=re.I)
              return text
          
          TOKEN = re.compile(
              r'\b(?:s19(?:\s*[jkie])?(?:\s*pro\+?)?(?:\s*xp\+?)?(?:\s*(?:hydro|hyd))?|s17(?:\s*pro|\+|e)?|s9[a-z]*|s7(?:-f1)?|s5|'
              r't21|t19|t17[a-z+]*|t15|t9\+|l3\+{0,2}|d3|z9\s*mini|m\d+[a-z+]*|'
              r'a1[01](?:\s*pro)?|t3s|t3h|t3\+(?:\s*pro)?|t2\s*turbo|'
              r't2tt?i|t2tsr|t2thf|t2thm|t2tz|t2ts|t2t(?:\s*th\+)?|'
              r'1126(?:\s*pro\s*s)?|1146(?:\s*pro)?|1066(?:\s*pro)?|1046|'
              r'a?921|a?920h?|841|a?851|a?852|e10|e9(?:\s*miner\+)?|'
              r'b8|bt200|h7\s*pro|a1|f1)(?![a-z0-9+])', re.I)
          BRANDED = re.compile(r'\b(?:antminer|whatsminer|microbt|innosilicon|avalon|canaan|ebit|bitfury|hummer|aiden|aladdin|cheetah)\b', re.I)
          PARTS = re.compile(r'х[еэ]ш.?плат|контрольн|контроллер|конвертер|переходник|эмулятор|\bкпу\b|\bбп\b|блок[аи]?\s+питани|корпус|вентил|кулер|шлейф|кабел|коса|чип|водоблок|жидкост|ванна|стойк|стеллаж|трафарет|тестер|контейнер|фланец|термопаст|разъ[её]м|коннектор|планка|шумбокс', re.I)
          BUYER = re.compile(r'выкуп|скупк|куплю|покупаем|выкупаем|при[её]м|утилизац|ремонт|хостинг|размещен|настройка|прошивка', re.I)
          ACCESSORY = re.compile(r'фильтр|filter|памят|memory|микросхем|комплектующ|запчаст|аксессуар|accessor|пылезащит|воздуховод|шумоглуш|ddr|eeprom|nand', re.I)
          UNITS = r'(?:шт(?:ук(?:и|а)?)?\.?|устройств\w*|аппарат\w*|асик\w*|майнер\w*|комплект\w*)'
          QTY = re.compile(r'(?<![\d.,])(?P<lo>\d{1,5})(?:\s*[–—-]\s*(?P<hi>\d{1,5}))?\s*' + UNITS, re.I)
          RATE = re.compile(r'(\d+(?:[.,]\d+)?)(?:\s*[/–-]\s*(\d+(?:[.,]\d+)?))?\s*(?:th|t[hx]?|тх|т|gh|g|г)(?:\b|/)', re.I)
          PRICE = re.compile(r'(\d[\d\s.,]*\s*(?:₽|руб\.?|р\.))\s*(?:/\s*(?:шт\.?|комплект)|за\s+(?:1\s*)?(?:шт\w*|комплект))', re.I)
          
          def identify(line):
              line = normalize_models(line)
              matches = list(TOKEN.finditer(line))
              if not matches:
                  if re.search(r'\baladdin\s*miner\b', line, re.I):
                      return [{'model': 'Aladdin Miner', 'minimum': 20, 'valid': True}]
                  return []
              found = []
              for match in matches:
                  token = re.sub(r'\s+', '', match.group().lower())
                  valid, minimum, required, name = True, 20, None, None
                  if token == 'm50':
                      minimum, name = 10, 'Whatsminer M50'
                  elif token == 't21':
                      minimum, name = 20, 'Antminer T21'
                  elif token in ('a10', 'a10pro', 'a11', 'a11pro'):
                      minimum, name = 1, 'Innosilicon ' + token.upper().replace('PRO', ' Pro')
                      if re.search(r'\b(?:avalon|canaan)\b', line, re.I):
                          valid = False
                  elif token.startswith('s19'):
                      name, minimum = 'Antminer ' + match.group().upper(), 15
                      valid = not ('xp' in token or 'hyd' in token)
                      rate = RATE.search(line[match.end():match.end()+35])
                      if rate:
                          name += ' ' + '/'.join(x for x in rate.groups() if x) + 'T'
                  elif token in ('s17','s17pro','s17+','s17e','s9','s9k','s7','s7-f1','s5','t19','t17','t15','t9+','l3+','l3++','z9mini'):
                      name = 'Antminer ' + token.upper().replace('PRO', ' Pro').replace('Z9MINI', 'Z9 Mini')
                  elif token == 'd3':
                      name, required = 'Antminer D3', {17,19.3}
                  elif token in ('m31s','m20s','m21s'):
                      name = 'Whatsminer ' + token.upper()
                      required = {'m31s':{74,76},'m20s':{65,68},'m21s':{52,54,56}}[token]
                  elif token in ('t3s','t3h','t3+','t2t','t2turbo','t2tz','t2ti','t2tti','t2ts','t2tsr','t2thf','t2thm','t2tth+'):
                      name = 'Innosilicon ' + token.upper().replace('T2TURBO','T2 Turbo').replace('T2TTH+','T2T TH+')
                      required = {'t3s':{39},'t3h':{50},'t3+':set(range(50,58)), 't2t':{29,32},'t2tz':{30},'t2tti':{25},'t2tsr':{25},'t2thf':{27},'t2tth+':{37}}.get(token)
                  elif token in ('1126pros','1146pro','1066pro','1046','921','a921','920h','a920h','841','851','a851','852','a852'):
                      name = 'Avalon ' + token.upper().replace('PROS',' Pro S').replace('PRO',' Pro')
                      if token[0].isdigit() and not re.search(r'\b(?:avalon|canaan)\s*$', line[:match.start()], re.I):
                          valid = False
                      required = {'1126pros':{68},'1146pro':{63},'1066pro':{55}}.get(token)
                  elif token in ('e10','e9miner+','b8','bt200','h7pro','a1','f1'):
                      name = {'e10':'Ebit E10','e9miner+':'Ebit E9 Miner+','b8':'Bitfury B8','bt200':'Bitfury BT200','h7pro':'Hummer Miner H7 Pro','a1':'Aiden Miner A1','f1':'Cheetah Miner F1'}[token]
                      if token in ('b8', 'bt200'):
                          minimum = 5
                      required = {'e10':{18},'b8':{50}}.get(token)
                      brand = name.split()[0]
                      if not re.search(r'\b' + brand + r'\b', line, re.I):
                          valid = False
                  else:
                      valid, name = False, token.upper()
                  if required:
                      rate = RATE.search(line[match.end():match.end()+35])
                      if rate:
                          values = [float(x.replace(',','.')) for x in rate.groups() if x]
                          valid = valid and all(v in required for v in values)
                          name += ' ' + '/'.join(f'{v:g}' for v in values) + ('G' if token == 'd3' else 'T')
                      else:
                          valid = False
                  found.append({'model':name,'minimum':minimum,'valid':valid})
              return found
          
          def run_parameters(items):
              return {'timeout':'120','waitForFinish':'60','maxTotalChargeUsd':'0.10',
                      'maxItems':str(items),'restartOnError':'false'}
          
          def sanitize(value, token=''):
              """Recursively redact credentials without altering diagnostic booleans."""
              if isinstance(value, dict):
                  return {sanitize(str(k), token): ('[REDACTED]' if re.search(
                      r'auth|cookie|password|secret|token|api.?key|headers|session|credential|signature|^sig$', str(k), re.I)
                      else sanitize(v, token)) for k, v in value.items()}
              if isinstance(value, list):
                  return [sanitize(v, token) for v in value]
              if not isinstance(value, str):
                  return value
              if token:
                  value = value.replace(token, '[REDACTED]')
              value = re.sub(r'apify_(?:api|ui)_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]{20,}', '[REDACTED]', value)
              def clean_url(match):
                  # Drop every query/fragment, not only known credential parameter names.
                  # This also covers encoded keys, SAS sig, OAuth fragments and new formats.
                  try:
                      url = urllib.parse.urlsplit(match.group())
                      authority = url.netloc.rsplit('@',1)[-1]
                      return urllib.parse.urlunsplit((url.scheme, authority, url.path,
                          '[REDACTED]' if url.query else '', '[REDACTED]' if url.fragment else ''))
                  except ValueError:
                      return '[REDACTED invalid URL]'
              value = re.sub(r'https?://[^\s\x22\x27<>]+', clean_url, value, flags=re.I)
              value = re.sub(r'(?im)^.*(?:authorization|cookie|api[-_]?key|access[-_]?token|refresh[-_]?token|client[-_]?secret)\s*[\x22\x27]?\s*[:=].*$', '[REDACTED credential header]', value)
              value = re.sub(r'(?i)\b(?:Bearer|Basic)\s+[A-Za-z0-9+/=_-]{8,}', '[REDACTED credential]', value)
              return value
          
          def save(path, data, token=''):
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('x', encoding='utf-8') as stream:
                  json.dump(sanitize(data, token), stream, ensure_ascii=False, indent=2)
                  stream.write('\n')
          
          def save_text(path, text, token=''):
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('x', encoding='utf-8') as stream:
                  stream.write(sanitize(text, token))
          
          def make_request(token, method, path, data=None, params=None):
              allowed_get = re.fullmatch(r'/(?:actor-runs/[A-Za-z0-9]+|datasets/[A-Za-z0-9]+/items|logs/[A-Za-z0-9]+|key-value-stores/[A-Za-z0-9]+/records/(?:INPUT|OUTPUT|summary|errors))', path)
              if not ((method == 'GET' and allowed_get) or
                      (method == 'POST' and path == '/actors/'+ACTOR+'/runs')):
                  raise ValueError('Unapproved Apify endpoint or method')
              url = BASE+path
              if params:
                  url += '?'+urllib.parse.urlencode(params)
              return urllib.request.Request(url, method=method,
                  data=json.dumps(data, ensure_ascii=False).encode('utf-8') if data is not None else None,
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json',
                           'Accept':'application/json, text/plain','User-Agent':'asic-apify-github-test'})
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          
          class ApiError(RuntimeError):
              def __init__(self, message, status=None):
                  super().__init__(message)
                  self.status = status
          
          def api(token, method, path, data=None, params=None, text=False):
              request = make_request(token, method, path, data, params)
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=80) as response:
                      raw = response.read(MAX_RESPONSE_BYTES+1)
                  if len(raw) > MAX_RESPONSE_BYTES:
                      raise ApiError('Apify response exceeds diagnostic size limit; not saved as complete.')
                  return raw.decode('utf-8') if text else json.loads(raw)
              except urllib.error.HTTPError as error:
                  raise ApiError(f'Apify HTTP {error.code}; request not automatically retried.', error.code) from None
              except ApiError:
                  raise
              except Exception:
                  raise ApiError('Apify response unavailable or invalid; request not automatically retried.') from None
          
          def city_info(row):
              raw = {key:row[key] for key in ('city','location','region','address') if key in row}
              def label(value):
                  if isinstance(value, dict):
                      value = value.get('name') or value.get('title') or ''
                  if not isinstance(value, str):
                      return ''
                  value = re.sub(r'^\s*(?:г\.|город)\s*', '', value.strip(), flags=re.I)
                  if not value or re.search(r'\d|[,;\n]|област|округ|район|республик|край\b|улиц|проспект|шоссе|переул|ул\.', value, re.I):
                      return ''
                  return value
              def explicit(value):
                  if not isinstance(value, dict):
                      return ''
                  for key in ('city','locality','town','settlement'):
                      found = label(value.get(key))
                      if found:
                          return found
                  if str(value.get('type','')).lower() in ('city','town','город','г'):
                      found = label(value)
                      if found:
                          return found
                  for key in ('location','region','address'):
                      found = explicit(value.get(key))
                      if found:
                          return found
                  return ''
              found = label(row.get('city'))
              if found:
                  return found, 'city', raw
              for key in ('location','region','address'):
                  value = row.get(key)
                  found = explicit(value)
                  if not found and isinstance(value, str):
                      match = re.search(r'(?:^|,\s*)(?:г\.|город)\s+([^,;\n]+)', value, re.I)
                      if match:
                          found = label(match.group(1))
                      elif value.strip().casefold() in ('москва','санкт-петербург','севастополь'):
                          found = value.strip()
                  if found:
                      return found, key, raw
              return 'не указан', 'unknown', raw
          
          def normalize(row):
              if not isinstance(row, dict) or row.get('blocked') or row.get('found') is False:
                  return None
              try:
                  part = urllib.parse.urlsplit(str(row.get('url') or ''))
                  match = re.search(r'_(\d+)$', part.path)
                  if (part.scheme != 'https' or part.username or part.password or
                          not ((part.hostname or '') == 'avito.ru' or (part.hostname or '').endswith('.avito.ru')) or not match):
                      return None
              except ValueError:
                  return None
              aid = str(row.get('listing_id') or row.get('id') or match.group(1))
              if aid != match.group(1):
                  return None
              city, city_source, raw_location = city_info(row)
              price = row.get('price')
              return {'ad_id':aid,'title':str(row.get('title') or row.get('name') or ''),
                      'url':part._replace(query='',fragment='').geturl(),
                      'city':city,'city_source':city_source,'location_raw':raw_location,'price':price,
                      'price_text':str(row.get('price_text') or row.get('priceText') or (str(price)+' ₽' if price is not None else 'не указана')),
                      'description_snippet':str(row.get('description') or ''),
                      'params_summary':str(row.get('condition') or '')}
          
          def candidates(rows, limit):
              result = {}
              for row in rows:
                  item = normalize(row)
                  if item:
                      result.setdefault(item['ad_id'], item)
              return list(result.values())[:limit]
          
          def model_key(token):
              token = re.sub(r'\s+', '', token.casefold())
              return 's19' if token.startswith('s19') else token
          
          def query_scope(query):
              text = normalize_models(query)
              tokens = list(TOKEN.finditer(text))
              found = identify(text)
              if len(tokens) != 1 or len(found) != 1 or not found[0]['valid']:
                  raise RuntimeError('Query must identify one supported model; ambiguous/unsupported query was not sent.')
              return model_key(tokens[0].group())
          
          def title_decision(title, query):
              scope = query_scope(query)
              text = normalize_models(title)
              goods = re.sub(r'на\s+запчасти', '', text, flags=re.I)
              parts_title = re.sub(r'\(\s*\d+\s+чип(?:а|ов)?\s*\)', '', text, flags=re.I)
              if BUYER.search(text) or PARTS.search(parts_title) or ACCESSORY.search(goods):
                  return 'reject', 'accessory_or_service'
              if re.search(r'\bxp\b|\bhyd(?:ro)?\b|гидро|s19\w*(?:xp|hydro)', text, re.I):
                  return 'reject', 'excluded_xp_or_hydro'
              known = {model_key(m.group()) for m in TOKEN.finditer(text)}
              shaped = {model_key(m.group()) for m in re.finditer(r'\b[a-z]{1,4}\d{1,5}[a-z0-9+]*\b', text, re.I)}
              keys = known | shaped
              if scope in keys and keys != {scope}:
                  return 'review', 'mixed_models_in_title'
              if scope not in keys:
                  return ('reject','different_model') if keys else ('review','model_not_clear_in_title')
              if not any(item['valid'] for item in identify(text)):
                  return 'review', 'variant_not_clear_in_title'
              return 'pass', 'model_matches_query'
          
          def select_candidates(rows, query, limit=3):
              selected, decisions, seen = [], [], set()
              for row in rows:
                  item = normalize(row)
                  if not item:
                      decisions.append({'decision':'reject','reason':'blocked_not_found_or_invalid_identity',
                                        'id':row.get('id') if isinstance(row,dict) else None})
                      continue
                  if item['ad_id'] in seen:
                      decisions.append({'ad_id':item['ad_id'],'decision':'reject','reason':'duplicate_id'})
                      continue
                  seen.add(item['ad_id'])
                  decision, reason = title_decision(item['title'], query)
                  decisions.append({'ad_id':item['ad_id'],'title':item['title'],'city':item['city'],
                                    'url':item['url'],'decision':decision,'reason':reason})
                  if decision == 'pass' and len(selected) < limit:
                      selected.append(item)
              return selected, decisions
          
          def merge_detail(search, detail):
              if search['ad_id'] != detail['ad_id']:
                  raise ValueError('Detail ID differs from search result')
              merged = dict(search)
              for key, value in detail.items():
                  if value not in (None, '', 'не указан'):
                      merged[key] = value
              if detail['city'] == 'не указан':
                  merged['city_source'] = search['city_source']
              merged['location_raw'] = {'search':search['location_raw'],'details':detail['location_raw']}
              return merged
          
          def read_diagnostics(token, run, stage_folder):
              outcomes = []
              store = run.get('defaultKeyValueStoreId')
              targets = [('log.txt','/logs/'+run['id'],True,True)]
              if store:
                  targets += [(name+'.json', '/key-value-stores/'+store+'/records/'+key, False, required)
                              for name,key,required in [('Input','INPUT',True),('summary','summary',True),('errors','errors',False),('OUTPUT-record','OUTPUT',False)]]
              else:
                  outcomes.append({'file':'Input.json','ok':False,'error':'defaultKeyValueStoreId absent'})
              for name, path, is_text, required in targets:
                  try:
                      value = api(token, 'GET', path, text=is_text)
                      (save_text if is_text else save)(stage_folder/name, value, token)
                      outcomes.append({'file':name,'ok':True})
                  except ApiError as error:
                      absent_optional = not required and error.status == 404
                      outcomes.append({'file':name,'ok':False,'optional_absent':absent_optional,'error':str(error)})
              save(stage_folder/'diagnostic-status.json', outcomes, token)

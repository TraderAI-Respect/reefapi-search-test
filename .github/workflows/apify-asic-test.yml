                  selected, decisions = select_candidates(search_rows, query, 3)
                  counters['model_pass'] = sum(x['decision']=='pass' for x in decisions)
                  save(folder/'search-normalized.json', candidates(search_rows,10), token)
                  save(folder/'model-decisions.json', decisions, token)
                  save(folder/'selected.json', selected, token)
                  if (folder/'search'/'read-errors.json').exists():

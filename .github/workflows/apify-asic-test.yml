                      counters['descriptions'] = len(detailed)
                  save(folder/'detail-decisions.json', detail_decisions, token)
                  save(folder/'page.json', {'query':query,'location':location,'ads':detailed}, token)
                  if (folder/'details'/'read-errors.json').exists():
                      raise RuntimeError('Details diagnostics incomplete; inspect details/read-errors.json. No retry was made.')
              except Exception as error:
                  # Never print unsanitized exception URLs, server bodies or credentials.
                  message = str(error) if isinstance(error,(RuntimeError,FileExistsError)) else type(error).__name__
                  save(folder/'collection-error.json', {'error':message,'no_automatic_retry':True}, token)
                  raise RuntimeError(sanitize(message,token)) from None
              finally:
                  save(folder/'collection-counters.json', counters, token)
          
          if __name__ == '__main__':
              try:
                  main()
              except RuntimeError as error:
                  print(str(error))
                  sys.exit(1)
